<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="בדיקות של סבתא">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2b6cb0">
<title>בדיקות של סבתא</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="view.css">
</head>
<body>
<section id="gate">
  <div id="gate-pending" hidden>
    <p class="gate-title">בקשת גישה</p>
    <p class="gate-text">שלחו את הקוד הזה לגילעד. אחרי שהוא יאשר את המכשיר, הדף ייפתח לבד.</p>
    <p class="gate-note" id="gate-standalone" hidden>מומלץ קודם להוסיף למסך הבית (שיתוף ← "הוסף למסך הבית") ולפתוח משם, אחרת יהיה צורך לבקש גישה פעמיים.</p>
    <code id="req-code" dir="ltr"></code>
    <p><button type="button" id="req-share">שליחה</button> <button type="button" id="req-copy">העתקה</button></p>
    <p class="gate-status" id="gate-status">ממתין לאישור…</p>
  </div>
  <div id="gate-revoked" hidden>
    <p class="gate-title">הגישה בוטלה</p>
    <p class="gate-text">המכשיר הזה כבר לא מורשה. לבקשת גישה מחדש:</p>
    <p><button type="button" id="req-again">בקשה חדשה</button></p>
  </div>
  <div class="err" id="gate-err"></div>
  <div class="busy" id="gate-busy">פותח…</div>
</section>
<div id="app" hidden></div>
<script src="view.js"></script>
<script src="cloud.js"></script>
</body>
</html>
